# Non-root drop-in template — DO NOT install blindly.
# Read design.md §12.4 first: group permissions for /etc/miniddns/ must be
# adjusted (root:miniddns, 0750/0640/0640) or the config/token become unreadable.
[Service]
User=miniddns
Group=miniddns
# 若使用凭据目录，确保 LoadCredential= 的源文件对 root 可读即可（systemd 会拷贝给该用户）
# LoadCredential=cloudflare.token:/etc/miniddns/cloudflare.token
