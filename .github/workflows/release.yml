name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: X.Y.Z (stable) or X.Y.Z-rcN (release candidate)'
        required: true
        type: string
      dry_run:
        description: 'Validate and build without tagging, committing or publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag, build 8 packages, changelog and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
      ZIG_VERSION: 0.13.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig cross compiler
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          mkdir -p "${RUNNER_TEMP}/zig"
          tar -xJf "${RUNNER_TEMP}/zig.tar.xz" -C "${RUNNER_TEMP}/zig" --strip-components=1
          "${RUNNER_TEMP}/zig/zig" version

      - name: Validate version input
        id: validate
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Releases must be triggered from the main branch."
            exit 1
          fi
          python3 scripts/gen_changelog.py --validate-only --version "${VERSION}"
          if [[ "${VERSION}" == *-rc* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${DRY_RUN}" == "false" ]]; then
            if git ls-remote --exit-code origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
              echo "::error::Tag ${VERSION} already exists. Choose a new version or delete the tag deliberately."
              exit 1
            fi
          fi
          prerelease="$(grep '^prerelease=' "${GITHUB_OUTPUT}" | cut -d= -f2)"
          echo "Validated version ${VERSION} (prerelease=${prerelease})"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git tag -a "${VERSION}" -m "Release ${VERSION}" HEAD
          git push origin "refs/tags/${VERSION}"
          echo "Created tag ${VERSION}"

      - name: Build, test and package all platforms
        run: |
          set -euo pipefail
          ZIG="${RUNNER_TEMP}/zig/zig"
          make -j"$(nproc)"
          make spec-check
          make verify-units
          make test
          make test-asan
          mkdir -p release-assets
          PLATFORMS="
            x86:x86-linux-musl:musl
            x86:x86-linux-gnu:glibc
            x64:x86_64-linux-musl:musl
            x64:x86_64-linux-gnu:glibc
            arm32:arm-linux-musleabihf:musl
            arm32:arm-linux-gnueabihf:glibc
            arm64:aarch64-linux-musl:musl
            arm64:aarch64-linux-gnu:glibc
          "
          for entry in ${PLATFORMS}; do
            arch="${entry%%:*}"
            rest="${entry#*:}"
            target="${rest%%:*}"
            libc="${rest##*:}"
            echo "::group::Building linux/${arch}/${libc} (${target})"
            make dist VERSION="${VERSION}" TARGET_ARCH="${arch}" LIBC="${libc}" \
                 ZIG_TARGET="${target}" ZIG="${ZIG}"
            id="miniddns-${VERSION}-linux-${arch}-${libc}"
            tar -czf "release-assets/${id}.tar.gz" -C dist "${id}"
            echo "::endgroup::"
          done
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS)
          echo "Built packages:"
          ls -1 release-assets

      - name: Generate changelog and release notes
        run: |
          set -euo pipefail
          python3 scripts/gen_changelog.py \
            --version "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --changelog CHANGELOG.md \
            --notes build/RELEASE_NOTES.md
          if [[ "${DRY_RUN}" == "false" ]]; then
            if ! git diff --quiet -- CHANGELOG.md; then
              git add CHANGELOG.md
              git commit -m "chore(release): update changelog for ${VERSION}"
              git push origin HEAD:main
            fi
          fi

      # Only the tarballs and the aggregate checksum file are published.
      # install.sh, configuration examples and service configuration examples
      # are INSIDE each tarball, never loose release assets.
      - name: Publish GitHub release
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "miniddns ${VERSION}" --notes-file build/RELEASE_NOTES.md)
          # Stable releases become "latest" automatically; only RC needs a flag.
          if [[ "${{ steps.validate.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${VERSION}" "${args[@]}" \
            release-assets/*.tar.gz \
            release-assets/SHA256SUMS
          echo "Published release ${VERSION} with 8 platform packages"

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          {
            echo "## Dry run for ${VERSION}"
            echo ""
            echo "No tag, commit or GitHub release was created."
            echo ""
            echo "### Packages built"
            echo ""
            ls -1 release-assets/*.tar.gz
            echo ""
            cat build/RELEASE_NOTES.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Release summary
        if: ${{ inputs.dry_run == false }}
        run: |
          {
            echo "## Released ${VERSION}"
            echo ""
            echo "- Tag: \`${VERSION}\`"
            echo "- Prerelease: ${{ steps.validate.outputs.prerelease }}"
            echo "- Packages: 8 tarballs (x86/x64/arm32/arm64 x musl/glibc) + SHA256SUMS"
            echo "- All installation and configuration files are inside each tarball"
          } >> "${GITHUB_STEP_SUMMARY}"
